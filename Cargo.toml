[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["examples/riscv-virt", "examples/aarch64-virt", "examples/demos", "examples/x86_64-pc", "examples/riscv-firmware", "examples/aarch64-hyp", "examples/x86_64-hyp", "examples/riscv-hyp", "examples/uefi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.88"

[workspace.dependencies]
osmium-arch = { path = "crates/arch", version = "0.1.0" }
osmium-sync = { path = "crates/sync", version = "0.1.0" }
osmium-mm = { path = "crates/mm", version = "0.1.0" }
osmium-hal = { path = "crates/hal", version = "0.1.0" }
osmium-drivers = { path = "crates/drivers", version = "0.1.0" }
osmium-sched = { path = "crates/sched", version = "0.1.0" }
osmium-boot = { path = "crates/boot", version = "0.1.0" }
osmium-virt = { path = "crates/virt", version = "0.1.0" }
osmium-exec = { path = "crates/exec", version = "0.1.0" }
osmium-fs = { path = "crates/fs", version = "0.1.0" }
osmium-proc = { path = "crates/proc", version = "0.1.0" }
osmium-fs-fat = { path = "crates/fs-fat", version = "0.1.0" }
osmium-net = { path = "crates/net", version = "0.1.0" }
osmium-fs-ext4 = { path = "crates/fs-ext4", version = "0.1.0" }
osmium-fs-iso9660 = { path = "crates/fs-iso9660", version = "0.1.0" }
osmium-iscsi = { path = "crates/iscsi", version = "0.1.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
# Nothing reachable from user space, the network, a disk image, a device or a guest may panic.
# Where a panic is a genuine internal invariant, allow it at that item with a comment saying why.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
string_slice = "warn"
