[package]
name = "osmium-virt"
description = "Osmium: hypervisor building blocks (guest memory, stage-2 tables, device buses, VM exits)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
## The RISC-V H-extension vCPU's world switch (riscv64 targets). Enables the
## matching guest-exit hook in `osmium-arch`.
riscv64-hs = ["osmium-arch/riscv64-hs"]
## The AArch64 EL2 vCPU's world switch (aarch64 targets, host at EL2).
aarch64-el2 = ["osmium-arch/aarch64-el2"]

[dependencies]
osmium-arch.workspace = true
osmium-boot.workspace = true
osmium-hal.workspace = true
osmium-mm.workspace = true
osmium-sync.workspace = true
