[package]
name = "osmium"
description = "A separable toolkit for building operating systems, firmware and hypervisors in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
keywords = ["os", "kernel", "no_std", "hypervisor", "firmware"]
categories = ["no-std", "embedded", "hardware-support", "os"]

[lints]
workspace = true

[features]
default = ["sync", "mm", "hal", "drivers", "boot"]
## Everything, including the parts that need `alloc`.
full = ["sync", "mm", "hal", "drivers", "boot", "sched", "virt", "exec", "fs", "proc", "fs-fat", "net"]
sync = ["dep:osmium-sync"]
mm = ["dep:osmium-mm"]
hal = ["dep:osmium-hal"]
drivers = ["dep:osmium-drivers"]
boot = ["dep:osmium-boot"]
## Tasks and scheduling (needs `alloc`).
sched = ["dep:osmium-sched"]
## Hypervisor building blocks (needs `alloc`).
virt = ["dep:osmium-virt"]
## Heap-free async executor.
exec = ["dep:osmium-exec"]
## Virtual file system and RAM file system (needs `alloc`).
fs = ["dep:osmium-fs"]
## Processes, user address spaces and Linux-numbered system calls (needs `alloc`).
proc = ["dep:osmium-proc", "sched", "fs", "mm", "boot"]
## FAT32 on any block device (needs `alloc`).
fs-fat = ["fs", "dep:osmium-fs-fat"]
## IPv4 network stack: ARP, ICMP, UDP, TCP, DHCP (needs `alloc`).
net = ["hal", "dep:osmium-net"]
## RISC-V machine-mode CSRs.
riscv-m-mode = ["osmium-arch/riscv-m-mode"]
## AArch64 EL2 registers.
aarch64-el2 = ["osmium-arch/aarch64-el2", "osmium-virt?/aarch64-el2"]
## RISC-V HS-mode hypervisor: guest-exit hook and the H-extension vCPU.
riscv64-hs = ["osmium-arch/riscv64-hs", "osmium-virt?/riscv64-hs"]

[dependencies]
osmium-arch.workspace = true
osmium-sync = { workspace = true, optional = true }
osmium-mm = { workspace = true, optional = true }
osmium-hal = { workspace = true, optional = true }
osmium-drivers = { workspace = true, optional = true }
osmium-boot = { workspace = true, optional = true }
osmium-sched = { workspace = true, optional = true }
osmium-virt = { workspace = true, optional = true }
osmium-exec = { workspace = true, optional = true }
osmium-fs = { workspace = true, optional = true }
osmium-proc = { workspace = true, optional = true }
osmium-fs-fat = { workspace = true, optional = true }
osmium-net = { workspace = true, optional = true }
