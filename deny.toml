# cargo-deny policy for the workspace: `cargo deny check` (https://github.com/EmbarkStudios/cargo-deny).
# Nothing in the build or scripts/check.sh needs cargo-deny installed; this file records the policy
# that third-party code is held to, so it can be checked by hand or in CI.
#
# The only crates.io dependencies are those of osmium-tls (rustls and the RustCrypto crates), which
# pins each one to an exact version. Every other crate is in this workspace.

[graph]
all-features = true

[advisories]
# Every RustSec advisory against a crate in Cargo.lock is an error unless listed here with a reason.
ignore = []

[licenses]
# Licences compatible with distributing the result under the workspace's GPL-2.0-only.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "GPL-2.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies carry versions, so they are not wildcards.
allow-wildcard-paths = true
deny = [
    # osmium-tls uses its own pure-Rust provider. `ring` appears in Cargo.lock only because
    # rustls-webpki's `alloc` feature names it as a weak dependency (`ring?/alloc`); it is never
    # built. Fail if anything starts to depend on it for real.
    { crate = "ring", reason = "osmium-tls has its own crypto provider; ring must not be linked" },
    { crate = "aws-lc-rs", reason = "C crypto library; osmium-tls has its own crypto provider" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
