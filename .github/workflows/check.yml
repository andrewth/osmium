# Runs the full gate, scripts/check.sh, on every push and pull request:
# host tests, clippy, rustdoc, the bare-metal builds, the examples linted and
# built, and the QEMU boots. Steps whose QEMU feature the runner's QEMU lacks
# (iommu-testdev, a GICv4 under TCG, Ssaia) or that need nested VMX are
# skipped by check.sh itself and listed at the end of its output.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU, firmware and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-system-misc \
            ovmf qemu-efi-aarch64 dosfstools bzip2 python3

      - name: Let the job use KVM if the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      # rust-toolchain.toml names the nightly channel, its components and
      # every target check.sh builds for; `rustup show` installs them.
      - name: Install the toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            examples/*/target
          key: check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-

      - name: scripts/check.sh
        run: ./scripts/check.sh
