[package]
name = "x86_64-pc"
description = "A tiny kernel for QEMU's x86_64 PC (q35), booted via PVH, assembled from Osmium components"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-only"

[dependencies]
osmium = { path = "../../crates/osmium", features = ["full"] }
demos = { path = "../demos" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
