[package]
name = "x86_64-vmx"
description = "A hypervisor for QEMU's x86_64 PC on Intel VMX, assembled from Osmium components"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-only"

[dependencies]
osmium = { path = "../../crates/osmium", features = ["full"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
