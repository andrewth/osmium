[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# The kernel runs where it is linked, with no loader to apply relocations.
rustflags = ["-C", "relocation-model=static"]
# TCG does not implement VMX; KVM with nested virtualization does.
runner = "qemu-system-x86_64 -machine q35 -accel kvm -cpu host -nographic -m 128M -no-reboot -kernel"
