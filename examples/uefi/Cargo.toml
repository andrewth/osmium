[package]
name = "uefi"
description = "A UEFI application that sets a GOP mode and draws on its framebuffer, then reads a file, allocates pages and exits boot services as a loader does, built from Osmium components"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-only"

[dependencies]
osmium-boot = { path = "../../crates/boot", default-features = false }
osmium-hal = { path = "../../crates/hal" }
osmium-mm = { path = "../../crates/mm" }
osmium-sysdrv = { path = "../../crates/sysdrv" }

# The workspace's lint policy (examples are not workspace members, so they
# do not inherit `[workspace.lints]`): keep the two in step.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
# Nothing reachable from user space, the network, a disk image, a device or a guest may panic.
# Where a panic is a genuine internal invariant, allow it at that item with a comment saying why.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
string_slice = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
